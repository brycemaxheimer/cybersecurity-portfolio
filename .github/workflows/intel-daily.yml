# Builds the day's intel brief (intel-brief/) and publishes it.
#
# Every edition still goes through a pull request, so there is a diff and an
# audit trail for each one. What the pull request no longer does is wait on a
# person: `python -m intel_brief verify` gates the edition and a clean run
# merges itself. The gates stand in for the human skim review mode relied on --
# shape, substance, cost, source health, and whether anything from an untrusted
# feed reached the page as markup or as an off-site link. A failed gate holds
# the pull request, labels it, and fails this job, so a held edition is
# notified rather than silently waiting.
#
# On merge, Cloudflare Workers Builds deploys intel-brief/site to the
# intel-brief Worker (intel.brycemaxheimer.com). This workflow never talks to
# Cloudflare.
name: Intel brief daily edition

on:
  schedule:
    # 10:00 UTC is 05:00 EST, the intended publication hour. Under daylight
    # saving the same cron is 06:00 EDT; GitHub cron has no timezone, and an
    # hour's drift for half the year is not worth a second schedule.
    #
    # That is when the run is *asked* for, not when it happens. GitHub's
    # scheduler is best-effort and queues under load: the first five runs
    # started 5h53m to 9h32m late. What that no longer affects is the content.
    # An edition covers the calendar day before its date, a window derived from
    # the date and not from the clock, so a run at 05:00 and the same run at
    # 13:00 produce the same edition. Lateness now moves only the hour the page
    # appears.
    #
    # The edition date still comes from the Eastern clock at run time, so a run
    # delayed past local midnight would date its edition a day on and report
    # the wrong day. From 10:00 UTC that is 19 hours of headroom, against the
    # 9h32m worst seen.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      writeup_model:
        description: Model for write-ups
        type: choice
        options: [claude-opus-5-5, claude-sonnet-5-5]
        default: claude-opus-5-5
      max_cost:
        description: Hard cost cap for this run (USD)
        default: "2.00"
      date:
        description: Edition date YYYY-MM-DD (blank = today, US Eastern)
        default: ""
      auto_merge:
        description: Publish the edition if every gate passes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: intel-daily-edition
  cancel-in-progress: false

defaults:
  run:
    working-directory: intel-brief

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # push the edition branch, merge the PR
      pull-requests: write   # open and merge the review PR
      issues: write          # label a held edition
    # Microsoft's Kusto emulator, for detection receipts (intel_brief/receipts/).
    # Starting it accepts its EULA. Pinned by digest, like the Actions below.
    # If it never answers, receipts are skipped and pages keep "untested".
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:983a27314b6dfa91a950bdf8fb4c6c2b8ce0d61fecf7decbcf370b3fdbfaa3a7
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    env:
      KUSTO_EMULATOR_URL: http://localhost:8080
      KUSTO_EMULATOR_WAIT: "180"
    steps:
      # ref: main, not the commit that triggered the run. A scheduled run is
      # queued against main as it was at the cron time and can start many hours
      # later (see the schedule note above), so the triggering commit is often
      # stale. The edition branch is cut from this checkout, and if it carried
      # an older .github/workflows/ than main, the push would be rejected with
      # "refusing to allow a GitHub App to create or update workflow ... without
      # `workflows` permission" -- a scope GITHUB_TOKEN cannot be granted here.
      # Building from the current tip also means the run uses the latest
      # pipeline code and sees every published edition when sizing its window.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r requirements.lock

      # Before the build, so a broken renderer or gate costs nothing in API spend.
      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch Kusto.Language (not redistributable, never committed)
        shell: pwsh
        run: ./tools/fetch_kusto_language.ps1

      - name: Edition date
        id: date
        env:
          DATE_INPUT: ${{ inputs.date }}  # via env, never interpolated into the script
        run: |
          d="$DATE_INPUT"
          if [ -z "$d" ]; then d=$(TZ=America/New_York date +%F); fi
          if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "bad date: $d"; exit 1; fi
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Build edition
        env:
          INTEL_BRIEF_ANTHROPIC_API_KEY: ${{ secrets.INTEL_BRIEF_ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MODEL: ${{ inputs.writeup_model || 'claude-opus-5-5' }}
          MAX_COST: ${{ inputs.max_cost || '2.00' }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          python -m intel_brief run --date "$DATE" --writeup-model "$MODEL" --max-cost "$MAX_COST"

      # Decides whether this edition may publish itself. Never fails the step:
      # a held edition still gets a pull request explaining why it was held.
      - name: Verify edition
        id: gates
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          set +e
          python -m intel_brief verify --date "$DATE" --report "$RUNNER_TEMP/gates.md"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then verdict=pass; else verdict=hold; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Gates: $verdict (exit $code)"
            cat "$RUNNER_TEMP/gates.md" 2>/dev/null || echo "The edition could not be read."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open review PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.date.outputs.date }}
          VERDICT: ${{ steps.gates.outputs.verdict }}
        run: |
          branch="intel/edition-$DATE"
          git config user.name "intel-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # Only the edition's data and rendered site; never anything else in the repo.
          git add data/ site/
          if git diff --cached --quiet; then
            echo "::error::The build wrote no edition for $DATE. Nothing to publish."
            exit 1
          fi
          git commit -m "Intel brief edition $DATE"
          # Bot-owned branch: a same-day re-run replaces it.
          git push --force origin "$branch"
          python - "$DATE" > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          import json, sys
          d = sys.argv[1]
          ed = json.load(open(f"data/editions/{d}.json", encoding="utf-8"))
          run = json.load(open(f"data/runs/{d}.json", encoding="utf-8"))
          c = run["cost"]
          print(f"Intel brief edition **{d}**.\n")
          print(f"- Cost: ${c['total_cost_usd']:.2f} of ${c['max_cost_usd']:.2f} cap ({len(c['calls'])} calls)")
          print(f"- Models: triage {ed['models']['triage']} ({ed['models']['triage_method']}), write-ups {ed['models']['writeup']}")
          print(f"- {len(ed['stories'])} stories, {len(ed['kev_new'])} new KEV, {len(ed['early_signals'])} early signals")
          print("\n### Stories\n")
          for s in ed["stories"]:
              print(f"{s['rank']}. {s['title']} (score {s['score']}, write-up: {s['writeup_status']})")
          print("\n### Verification\n")
          EOF
          cat "$RUNNER_TEMP/gates.md" >> "$RUNNER_TEMP/pr-body.md"
          # Earlier editions still open mean the archive has a hole, and the
          # collection window only reaches back 72 h before intel is lost.
          stale=$(BRANCH="$branch" gh pr list --state open --json number,title,headRefName \
            --jq '.[] | select(.headRefName | startswith("intel/edition-"))
                      | select(.headRefName != env.BRANCH) | "- #\(.number) \(.title)"' || true)
          if [ -n "$stale" ]; then
            printf '\n### Earlier editions still unpublished\n\n%s\n' "$stale" >> "$RUNNER_TEMP/pr-body.md"
          fi
          if [ "$VERDICT" = pass ]; then
            printf '\nMerging automatically: every gate passed.\n' >> "$RUNNER_TEMP/pr-body.md"
          else
            printf '\nReview `intel-brief/site/editions/%s/index.html`, then merge to publish.\n' "$DATE" >> "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr create --base main --head "$branch" --title "Intel brief: edition $DATE" --body-file "$RUNNER_TEMP/pr-body.md" \
            || gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.gates.outputs.verdict == 'pass' && (github.event_name != 'workflow_dispatch' || inputs.auto_merge)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # No --delete-branch: that branch is checked out here, so gh's local
          # cleanup can fail and make a successful publish look broken.
          if out=$(gh pr merge "$BRANCH" --squash 2>&1); then
            echo "::notice::Published $BRANCH to intel.brycemaxheimer.com."
            git push origin --delete "$BRANCH" || true
          else
            echo "$out"
            # `main` is a protected branch. If its rules require an approving
            # review (or a status check this job cannot post), GitHub refuses
            # the bot's merge and the edition stays unpublished. The gates in
            # `intel_brief verify` are what replaced that review, so the rule
            # has to let this workflow through for publishing to be automatic.
            case "$out" in
              *"Protected branch"*|*"review"*|*"required status check"*|*"not mergeable"*|*"405"*)
                echo "::error::Gates passed but main's protection rules refused the bot's merge. Allow github-actions[bot] to bypass the pull-request requirement on main (Settings, Branches, or Rules), or merge PR for $BRANCH by hand. Until then every edition stops here."
                ;;
              *)
                echo "::error::Gates passed but merging $BRANCH failed. See the output above."
                ;;
            esac
            exit 1
          fi

      # A held edition must be noisy: the next run's window only stretches back
      # 72 h, so intel is lost if nobody looks within three days.
      - name: Hold for review
        if: steps.gates.outputs.verdict != 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          gh label create needs-review --color B60205 --force \
            --description "An intel brief edition did not pass its gates" || true
          gh pr edit "$BRANCH" --add-label needs-review || true
          num=$(gh pr view "$BRANCH" --json number --jq .number || echo "?")
          echo "::error::Edition $DATE failed verification and was not published. See PR #$num and the job summary."
          exit 1
