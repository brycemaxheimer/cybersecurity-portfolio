  <rect x="5.5" y="3.5" width="21" height="25" rx="1.8" fill="#FFFFFF"/>
  <path d="M5.5 5.3a1.8 1.8 0 0 1 1.8-1.8h17.4a1.8 1.8 0 0 1 1.8 1.8v6.7H5.5z" fill="#B3141B"/>
  <rect x="8.5" y="15" width="15" height="3" rx="1.5" fill="#141414"/>
  <rect x="8.5" y="19.8" width="15" height="2.4" rx="1.2" fill="#141414" fill-opacity=".42"/>
  <rect x="8.5" y="23.8" width="9" height="2.4" rx="1.2" fill="#141414" fill-opacity=".42"/>
</svg>
