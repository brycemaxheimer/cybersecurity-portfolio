<!-- The brief itself: an ink ground, a white sheet, the red nameplate band and
     two headline rules. Colours are the site's own tokens (ink #141414, brand
     #B3141B, white), so the tab matches the masthead.
     Geometry only, no text element: a favicon cannot rely on a webfont. -->
