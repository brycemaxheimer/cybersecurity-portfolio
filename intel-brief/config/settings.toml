# Run settings. CLI flags override these (python -m intel_brief run --help).

[site]
base_url = "https://intel.brycemaxheimer.com"
title = "Daily Intel Brief"
author = "Bryce Maxheimer"
timezone = "America/New_York"

[models]
triage = "claude-haiku-5-5"
# claude-opus-5-5 (default) or claude-sonnet-5-5
writeup = "claude-opus-5-5"
writeup_effort = "medium"

[budget]
# Hard cap per run. A call is only made if its worst case still fits.
max_cost_usd = 2.00

[edition]
top_stories = 10
# Stories below this score never get a write-up.
min_score = 25
# Most editions kept in the RSS / JSON feeds.
feed_editions = 30

[verify]
# Gates every edition must pass before it merges and publishes itself
# (python -m intel_brief verify). A failed gate holds the pull request for a
# person instead of publishing; a warning publishes and is recorded in the PR.
min_stories = 3
# A missing write-up this high up the page blocks; a few further down warn.
protected_ranks = 3
max_failed_writeups = 2
# Feeds the brief cannot be trusted without, by their name in sources.toml.
required_sources = ["CISA KEV", "NVD"]
# Share of all feeds allowed to error before the edition is held.
max_source_error_ratio = 0.25
# Smallest believable rendered edition page, in bytes.
min_page_bytes = 20000

[collect]
# No lookback setting: an edition covers the calendar day before its date, in
# the [site] timezone, and that window is derived from the date alone.
mastodon_max_pages = 25
bluesky_max_pages = 10
# Characters of feed text passed to the models per item (never published).
item_text_chars = 2500

[signals]
# Distinct accounts that must post about a CVE in the window.
min_authors = 3
max_signals = 10

[detections]
sigma_retry_on_fail = true

[explainer]
# One extra call per edition with the write-up model, after the write-ups, so it
# never takes budget from them: a concept explainer plus good news. About $0.10-0.25.
enabled = true
max_tokens = 12000
good_news_max = 4
# News and advisory items offered as good-news candidates, and characters of each.
candidate_items = 150
item_text_chars = 500
# Concepts from this many earlier editions are passed in so topics don't repeat.
history_editions = 30
